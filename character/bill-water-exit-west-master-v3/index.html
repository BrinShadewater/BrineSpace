<!doctype html><meta charset="utf-8"><title>Bill West master exit candidate</title><style>body{background:#182932;color:#eee;font:18px sans-serif;margin:24px}section{display:flex;gap:20px}canvas{background:#14242e;max-width:45vw}img{width:100%;max-width:1600px;display:block;margin:20px 0}button{font:inherit;margin:12px 6px}</style><h1>Bill west - complete exit candidate</h1><p>Five independently authored exit poses, bare and helmeted. Original proportions, grade, floor contact and in-game motion remain under review.</p><section><div>Bare<br><canvas id="bare" width="352" height="320"></canvas></div><div>Helmet<br><canvas id="helmet" width="352" height="320"></canvas></div></section><button id="play">Play exit</button><button id="prev">Previous pose</button><button id="next">Next pose</button><span id="status"></span><h2>Complete exit</h2><img src="full-exit-review.png"><h2>Original master and build</h2><img src="master-build-review.png"><h2>Head and collar</h2><img src="neck-review.png"><h2>Previous and new poses</h2><img src="prior-comparison.png"><script>const names=['Swimming','Low elbow','Palm push','Knee tuck','Half kneel','Rise','Standing'],starts=[0,60,110,170,240,340,440],banks={},ctx={};let phase=0,playing=false,last=0,time=0;function draw(){for(const g of ['bare','helmet']){ctx[g].clearRect(0,0,352,320);ctx[g].drawImage(banks[g][phase],0,0)}document.querySelector('#status').textContent=names[phase]+' /pose '+(phase+1)+' of 7'}Promise.all(['bare','helmet'].map(async g=>{ctx[g]=document.querySelector('#'+g).getContext('2d');banks[g]=await Promise.all(names.map((_,i)=>new Promise(resolve=>{const im=new Image;im.onload=()=>resolve(im);im.src=g+'/frames/swim-land-west/'+String(i).padStart(3,'0')+'.png'})))})).then(draw);document.querySelector('#play').onclick=()=>{playing=!playing;if(playing){time=0;phase=0;last=performance.now()}document.querySelector('#play').textContent=playing?'Pause':'Play exit';draw()};function step(delta){playing=false;document.querySelector('#play').textContent='Play exit';phase=Math.max(0,Math.min(6,phase+delta));time=starts[phase];draw()}document.querySelector('#next').onclick=()=>step(1);document.querySelector('#prev').onclick=()=>step(-1);function tick(now){if(playing){time=Math.min(500,time+now-last);phase=starts.filter(t=>t<=time).length-1;if(time>=500){playing=false;document.querySelector('#play').textContent='Play exit'}draw()}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
