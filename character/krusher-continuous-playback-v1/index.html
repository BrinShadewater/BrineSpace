<!doctype html><meta charset="utf-8"><title>Krusher Dom continuous motion audit</title><style>body{margin:0;background:#192228;color:#dce8e8;font:16px system-ui}header{padding:12px}button{font:inherit;padding:8px;margin-right:8px}canvas{display:block;width:1200px;height:720px}#status{white-space:pre-wrap}</style><header><label>Start batch <input id="batch" type="number" min="1" max="98" value="95" style="width:55px"></label><label>End batch <input id="end" type="number" min="1" max="98" value="95" style="width:55px"></label><button id="start">Start complete playback audit</button><button id="pause">Pause</button><span id="status">Loading libraryâ€¦</span></header><canvas id="stage" width="1200" height="720" aria-label="Six animations playing continuously at source timing"></canvas><script>
let lib,plans,states,batch=0,halt=false,started=false,totalSlots=0,doneStates=0,errors=[],cache=new Map();const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
fetch('library.json').then(r=>r.json()).then(j=>{lib=j;plans=j.plans;states=j.states;status.textContent=`Ready: ${plans.length} states / 8,058 holds / 72 contextual turns`;});
async function post(name,body,type){let r=await fetch('/evidence/'+name,{method:'POST',headers:{'Content-Type':type},body});if(!r.ok)throw Error('Evidence save failed '+name)}
async function getImage(path){if(cache.has(path))return cache.get(path);let im=new Image();for(let attempt=0;attempt<4;attempt++){im.src=path+(attempt?'?retry='+attempt:'');try{await im.decode();cache.set(path,im);return im}catch(e){if(attempt===3)throw Error(path+': '+e.message)}}}
function atState(key,t){let s=states[key],total=s.durations.reduce((a,b)=>a+b,0);t=s.loop?t%total:Math.min(t,total-.001);let i=0;while(i<s.durations.length-1&&t>=s.durations[i])t-=s.durations[i++];return {key,s,i}}
function pose(plan,t){let seg=plan.segments[plan.segments.length-1],local=t;for(let q of plan.segments){seg=q;if(local<q.duration)break;local-=q.duration}if(t>=plan.duration-500)local=seg.duration-.001;return {...atState(seg.key,local),role:seg.role}}
function drawPanel(plan,t,j,log){let p=pose(plan,t),s=p.s,x=j%3*400,y=Math.floor(j/3)*360;ctx.save();ctx.beginPath();ctx.rect(x,y,400,360);ctx.clip();ctx.fillStyle=j%2?'#2b363c':'#303c42';ctx.fillRect(x,y,400,360);ctx.fillStyle='#e6eded';ctx.font='13px monospace';ctx.fillText(plan.key,x+8,y+17);ctx.fillStyle='#aec9ce';ctx.fillText(`${p.role}: ${p.key} / ${p.i+1}`,x+8,y+35);let b=s.bounds,z=Math.min(1.65,360/Math.max(1,b[2]-b[0]),275/Math.max(1,b[3]-b[1]));let cx=x+190-(b[0]+b[2])*z/2,cy=y+70-b[1]*z,im=cache.get(s.files[p.i]);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,cx-s.pivot[0]*z,cy-s.pivot[1]*z,s.width*z,s.height*z);ctx.strokeStyle='#789498';ctx.beginPath();ctx.moveTo(cx-7,cy);ctx.lineTo(cx+7,cy);ctx.stroke();let h=s.heads[p.i];ctx.fillStyle='#1d282e';ctx.fillRect(x+272,y+180,120,150);ctx.drawImage(im,h[0]-28,h[1]-30,56,60,x+276,y+184,112,120);ctx.fillStyle='#aec9ce';ctx.fillText('2x neck detail',x+276,y+320);ctx.restore();if(p.role==='target'){log.seen[p.i]=true;let loop=Math.floor(t/Math.max(1,plan.duration-500));if(log.last!==p.i){log.events.push({ms:Math.round(t),slot:p.i,role:p.role,key:p.key});log.last=p.i}}return p}
document.querySelector('#pause').onclick=()=>{halt=!halt;document.querySelector('#pause').textContent=halt?'Resume':'Pause'};
document.querySelector('#start').onclick=async()=>{if(started)return;started=true;document.querySelector('#start').disabled=true;await run()};
async function run(){await post('contract.json',JSON.stringify(lib),'application/json');for(batch=Number(document.querySelector('#batch').value)-1,doneStates=batch*6,totalSlots=plans.slice(0,batch*6).reduce((a,p)=>a+p.targetSlots,0);batch<Number(document.querySelector('#end').value);batch++){let rows=plans.slice(batch*6,batch*6+6);cache.clear();let preload=[...new Set(rows.flatMap(p=>p.segments.flatMap(seg=>states[seg.key].files)))];let cursor=0;await Promise.all(Array.from({length:4},async()=>{while(cursor<preload.length)await getImage(preload[cursor++])}));let logs=rows.map(p=>({key:p.key,seen:Array(p.targetSlots).fill(false),events:[],last:-1})),gaps=[],chunks=[];let stream=canvas.captureStream(60);let rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:2200000});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};let ended=new Promise(resolve=>rec.onstop=resolve);rec.start();let end=Math.max(...rows.map(p=>p.duration)),epoch=null,last=null,pausedTotal=0,pauseStart=null;await new Promise(resolve=>{function frame(now){if(epoch===null)epoch=now;if(halt){if(pauseStart===null)pauseStart=now;requestAnimationFrame(frame);return}if(pauseStart!==null){pausedTotal+=now-pauseStart;pauseStart=null;last=null}let t=now-epoch-pausedTotal;if(last!==null)gaps.push(now-last);last=now;rows.forEach((p,j)=>drawPanel(p,Math.min(t,p.duration-.001),j,logs[j]));status.textContent=`Playing batch ${batch+1}/98 · ${doneStates}/${plans.length} states completed · ${totalSlots}/8058 holds captured`;if(t>=end){resolve();return}requestAnimationFrame(frame)}requestAnimationFrame(frame)});rec.stop();await ended;stream.getTracks().forEach(t=>t.stop());let missing=logs.flatMap(log=>log.seen.flatMap((seen,i)=>seen?[]:[{key:log.key,slot:i}]));errors.push(...missing);let report={batch,rows:logs,missing,frames:gaps.length+1,maxRafGapMs:Math.max(...gaps),durationMs:end};await post(`batch-${String(batch).padStart(3,'0')}.json`,JSON.stringify(report),'application/json');await post(`batch-${String(batch).padStart(3,'0')}.webm`,new Blob(chunks,{type:'video/webm'}),'video/webm');totalSlots+=logs.reduce((a,l)=>a+l.seen.filter(Boolean).length,0);doneStates+=rows.length;await post('progress.json',JSON.stringify({batch:batch+1,doneStates,totalSlots,errors,complete:doneStates===plans.length}),'application/json');}status.textContent=`COMPLETE: ${doneStates}/586 states · ${totalSlots}/8058 frame holds · ${errors.length} missing · 72 turns with entry and destination. Videos and advancing pose logs saved.`;}
</script>
