<!doctype html><meta charset="utf-8"><title>Bill South entry study</title><style>body{background:#182932;color:#eee;font:17px sans-serif}canvas{height:min(600px,calc(100vh - 190px));width:auto;max-width:100%}img{max-width:100%}button,select{font:inherit;margin:6px;padding:6px}</style><h1>Bill South water-entry study</h1><p>Seven new whole poses, exact selected idle and swim endpoints. Master/grade/motion, helmet and native contact remain pending.</p><button id="play">Play once</button><button id="next">Next pose</button><select id="speed"><option value="1">Normal</option><option value="4">Quarter</option></select><span id="pose"></span><br><canvas width="640" height="704"></canvas><br><img src="entry-contact.png"><script>const data={"frames": ["frames/land-swim-south/000.png", "frames/land-swim-south/001.png", "frames/land-swim-south/002.png", "frames/land-swim-south/003.png", "frames/land-swim-south/004.png", "frames/land-swim-south/005.png", "frames/land-swim-south/006.png", "frames/land-swim-south/007.png", "frames/land-swim-south/008.png"], "times": [40, 50, 55, 55, 60, 60, 60, 60, 60]};const images=data.frames.map(s=>{const im=new Image();im.src='bare/'+s;return im}),ctx=document.querySelector('canvas').getContext('2d');let index=0,run=0;function draw(){ctx.clearRect(0,0,640,704);if(images[index].complete)ctx.drawImage(images[index],0,0,640,704);document.getElementById('pose').textContent='Pose '+index}images.forEach(im=>im.onload=draw);document.getElementById('next').onclick=()=>{run++;index=(index+1)%9;draw()};document.getElementById('play').onclick=async()=>{const token=++run;for(index=0;index<9;index++){if(run!==token)return;draw();await new Promise(r=>setTimeout(r,data.times[index]*Number(document.getElementById('speed').value)))}index=8;draw()};draw();</script>
