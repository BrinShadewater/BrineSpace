<!doctype html><meta charset="utf-8"><title>Bill South paired exit</title><style>body{background:#182932;color:#eee;font:17px sans-serif}canvas{height:min(600px,calc(100vh - 190px));width:auto;max-width:100%}img{max-width:100%}button,select{font:inherit;margin:6px;padding:6px}</style><h1>Bill South — bare and helmet exit</h1><p>Master-based squat revision: closer head size; matte grade remains under review. Source review; full master, motion and native contact checks remain pending.</p><select id="gear" aria-label="Equipment"><option value="bare">Bare</option><option value="helmet">Helmet</option></select><button id="play">Play once</button><button id="pause">Pause</button><button id="prev">Previous pose</button><button id="next">Next pose</button><select id="speed" aria-label="Speed"><option value="1">Normal</option><option value="4">Quarter</option></select><span id="pose"></span><br><canvas width="640" height="704"></canvas><br><img src="paired-exit-contact.png" alt="Eight paired body poses"><script>
const times=[40,60,65,65,65,65,65,75],images={};for(const gear of ['bare','helmet'])images[gear]=times.map((_,i)=>{const im=new Image();im.src=gear+'/frames/swim-land-south/'+String(i).padStart(3,'0')+'.png';im.onload=draw;return im});const ctx=document.querySelector('canvas').getContext('2d');let index=0,run=0;function draw(){const gear=document.getElementById('gear').value,im=images[gear][index];ctx.clearRect(0,0,640,704);if(im.complete&&im.naturalWidth)ctx.drawImage(im,0,0,640,704);document.getElementById('pose').textContent=gear+' · Pose '+index}document.getElementById('gear').onchange=()=>{run++;draw()};document.getElementById('pause').onclick=()=>{run++};document.getElementById('prev').onclick=()=>{run++;index=Math.max(0,index-1);draw()};document.getElementById('next').onclick=()=>{run++;index=Math.min(7,index+1);draw()};document.getElementById('play').onclick=async()=>{const token=++run;for(let i=0;i<8;i++){if(run!==token)return;index=i;draw();await new Promise(r=>setTimeout(r,times[i]*Number(document.getElementById('speed').value)))}if(run===token){index=7;draw()}};draw();</script><p><a href="master-comparison.png">Original master and before/after comparison</a></p>
