<!doctype html><meta charset="utf-8"><title>Bill cardinal rest family</title>
<style>body{background:#14232b;color:#d1d9dc;font:16px system-ui;padding:24px}main{display:flex;flex-wrap:wrap;gap:22px}article{background:#22343e;padding:18px;border-radius:10px}canvas{display:block;width:256px;height:256px}button,input{margin:8px 0}p{max-width:780px}</style>
<h1>Bill · Cardinal rest family</h1><p>Paired normal-loader family. Compare each action with its selected idle. Specialised east bunk remains separate; live motion polish and generic furniture contacts remain pending.</p>
<main></main><script type="module">
const equipment=new URLSearchParams(location.search).get('gear')==='helmet'; const m=await (await fetch(equipment?'helmet-manifest.json':'manifest.json')).json();

const cache=new Map();for(const s of m.states)for(const path of s.frameFiles){if(cache.has(path))continue;const im=new Image();im.src='/'+path.slice(6);await im.decode();cache.set(path,im)}
for(const s of m.states){const direction=s.id.split('-').at(-1);const master=new Image();master.src=`../bill-seated-${equipment?'helmet-':''}${direction}-coherent-v1/frames/sit-down-${direction}/000.png`;await master.decode();const el=document.createElement('article');el.innerHTML=`<h2>${s.id}</h2><canvas width="256" height="256"></canvas><button>Replay</button> <label><input type="checkbox" checked>Play</label><br><input type="range" min="0" max="${s.frameDurationsMs.reduce((a,b)=>a+b,0)}" value="0"><p>Selected idle master</p><canvas width="256" height="256"></canvas>`;document.querySelector('main').append(el);const [c,ref]=el.querySelectorAll('canvas');ref.getContext('2d').drawImage(master,0,0);const slider=el.querySelector('input[type=range]'),play=el.querySelector('input[type=checkbox]');let start=performance.now(),scrub=0;el.querySelector('button').onclick=()=>{start=performance.now();play.checked=true};slider.oninput=()=>{scrub=+slider.value;play.checked=false};play.onchange=()=>{start=performance.now()-scrub};const total=+slider.max;function draw(now){let time=play.checked?(s.loop?(now-start)%total:Math.min(now-start,total)):scrub;slider.value=time;let i=0;for(;i<s.frameDurationsMs.length-1&&time>=s.frameDurationsMs[i];i++)time-=s.frameDurationsMs[i];const ctx=c.getContext('2d');ctx.clearRect(0,0,256,256);ctx.drawImage(cache.get(s.frameFiles[i]),0,0);requestAnimationFrame(draw)}requestAnimationFrame(draw)}
</script>
