<!doctype html><meta charset="utf-8"><title>Bill East interaction consistency study</title><style>body{background:#1f2328;color:#eee;font:18px sans-serif;margin:24px}img{max-width:100%}.pair{display:flex;gap:20px;flex-wrap:wrap}canvas{width:352px;height:352px;background:#1f2328}button{font:inherit;margin:6px;padding:8px}</style><h1>Bill — East interaction consistency study</h1><p>Original-master face and matte suit detail across the reach. Candidate remains under review alongside idle and walking.</p><button id="play">Play normally</button><button id="slow">Play slowly</button><span id="pose">Ready</span><div class="pair"><div><p>Current selected</p><canvas id="old" width="352" height="352"></canvas></div><div><p>New study</p><canvas id="new" width="352" height="352"></canvas></div></div><h2>Master and neighboring animations</h2><img src="family-master-context-review.png"><script>const times=[70,140,180,160,140,70],a=[],b=[];let run=0;for(let i=0;i<6;i++){const n=String(i).padStart(3,'0');a[i]=new Image();a[i].src='../bill-bare-east-selected-v1/frames/interact-east/'+n+'.png';b[i]=new Image();b[i].src='frames/interact-east/'+n+'.png';a[i].onload=b[i].onload=()=>draw(0)}function draw(i){for(const [id,ims] of [['old',a],['new',b]]){const ctx=document.getElementById(id).getContext('2d');ctx.clearRect(0,0,352,352);if(ims[i].complete)ctx.drawImage(ims[i],68,52)}document.getElementById('pose').textContent='Pose '+(i+1)+' of 6'}async function play(speed){const token=++run;for(let i=0;i<6;i++){if(token!==run)return;draw(i);await new Promise(r=>setTimeout(r,times[i]*speed))}}document.getElementById('play').onclick=()=>play(1);document.getElementById('slow').onclick=()=>play(4);</script>
