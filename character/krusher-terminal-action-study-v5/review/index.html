<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krusher terminal shared-master revision</title>
<style>body{background:#272b2e;color:#e5ebee;font:18px system-ui;margin:24px}canvas{image-rendering:pixelated;max-width:100%}button{font:inherit;padding:8px;margin:4px}p{max-width:800px}</style>
<h1>Krusher Dom / terminal action revision</h1><p>Corrected locomotion and action now share an exact idle master. Cuff-tracked glove foreground retained at resting joins. Complete motion and station review remain.</p>
<button id="play">Pause</button><button id="step">Next pose</button><label>Pose <select id="pose"></select></label><span id="status">Loading</span><br><canvas width="736" height="368"></canvas><p>Left: exact original idle. Right: revised candidate. Unselected artwork.</p>
<script>
const ctx=document.querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;
let images={},order=[],index=0,last=0,elapsed=0,playing=true,cycles=0;
function draw(){ctx.clearRect(0,0,736,368);ctx.drawImage(images['frames/idle.png'],0,0,368,368);ctx.drawImage(images[order[index].path],368,0,368,368);document.querySelector('#status').textContent=`${order[index].path} / step ${index+1} of ${order.length} / cycles ${cycles}`;document.querySelector('#pose').value=order[index].path;}
function tick(now){const delta=last?now-last:0;last=now;if(order.length&&playing){elapsed+=Math.min(delta,100);while(elapsed>=order[index].duration){elapsed-=order[index].duration;index=(index+1)%order.length;if(index===0)cycles++;}draw();}requestAnimationFrame(tick);}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';};document.querySelector('#step').onclick=()=>{playing=false;document.querySelector('#play').textContent='Play';index=(index+1)%order.length;elapsed=0;draw();};
document.querySelector('#pose').onchange=e=>{playing=false;document.querySelector('#play').textContent='Play';index=order.findIndex(o=>o.path===e.target.value);elapsed=0;draw();};
fetch('../action-manifest.json').then(r=>r.json()).then(async m=>{const sequence=[m.states[0],m.states[1],m.states[1],m.states[2]];const paths=[...new Set(sequence.flatMap(s=>s.frameFiles))];await Promise.all(paths.map(path=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[path]=im;resolve();};im.onerror=reject;im.src='../'+path;})));order=sequence.flatMap(s=>s.frameFiles.map((path,i)=>({path,duration:s.frameDurationsMs[i]})));for(const path of paths){const option=document.createElement('option');option.value=path;option.textContent=path;document.querySelector('#pose').append(option);}draw();requestAnimationFrame(tick);}).catch(()=>document.querySelector('#status').textContent='Load failed');
</script>
