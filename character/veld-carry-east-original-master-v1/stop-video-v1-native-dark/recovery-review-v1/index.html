<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veld carrying stop review</title><style>body{background:#202a30;color:#e9eff2;font:16px system-ui;margin:24px}main{max-width:900px;margin:auto}button,select{font:inherit;padding:8px;margin:4px;background:#344650;color:inherit;border:1px solid #728792;border-radius:5px}img{display:block;max-width:100%;height:auto}p{line-height:1.5}</style><main><h1>Veld carrying stop — recovery review</h1><p>Fourteen consecutive recovery poses, shown beside the standing master and a walking pose at three display sizes.</p><select id="gear"><option value="bare">Without helmet</option><option value="helmet">With helmet</option></select><button id="replay">Replay</button><img id="view" alt="Veld carrying stop beside original master and walking pose"><p>Work in progress: the foot recovery is smoother, but final foot placement and the join from walking still need correction.</p><script>const gear=document.querySelector('#gear'),view=document.querySelector('#view');function play(){view.src='../'+gear.value+'-native-full-source.png?v='+Date.now()}gear.onchange=document.querySelector('#replay').onclick=play;play()</script></main></html>
