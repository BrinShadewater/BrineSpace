<!doctype html><html lang="en"><meta charset="utf-8"><title>Veld — East walking travel study</title>
<style>body{margin:0;background:#151e24;color:#e2e7e8;font:16px system-ui}main{max-width:940px;margin:24px auto;padding:0 18px}h1{font-size:25px}p{color:#b7c5cc;line-height:1.5}button{background:#354751;color:white;border:1px solid #69808a;border-radius:5px;padding:9px 16px;margin:0 8px 8px 0;cursor:pointer}button[aria-pressed=true]{background:#65818f}#travel{display:block;width:900px;max-width:100%;height:auto;background:#202a30}.compare{display:flex;gap:32px;align-items:center;background:#202a30;padding:16px}.compare figure{margin:0;text-align:center}.compare img{width:161px;height:161px;object-fit:contain}figcaption{font-size:14px;color:#c0cdd1}</style>
<main><h1>Veld — East walking travel study</h1><p>The same walk at three travel distances, with the original helmet. This is a staged study; foot contact and the start/stop transitions still need work.</p>
<div><button id="bare" aria-pressed="true">Without helmet</button><button id="helmet" aria-pressed="false">With helmet</button></div>
<div><button id="short" aria-pressed="false">Shorter travel</button><button id="middle" aria-pressed="true">Middle travel</button><button id="long" aria-pressed="false">Longer travel</button></div>
<img id="travel" src="native-trial1-bare-review.png.apng" alt="Actual engine travel captures at three character sizes">
<p>Travel playback uses the captured engine frames. It jumps back to the beginning when the two-step test repeats.</p>
<div class="compare"><figure><img id="walk" src="bare-cycle-study.png" alt="Full source walk"><figcaption>Walking source</figcaption></figure><figure><img id="master" src="../../veld-east-held-original-master-v1/frames/bare/000.png" alt="Original-guided East held master"><figcaption>Held master</figcaption></figure></div>
</main><script>let gear='bare',trial=1;function update(){document.querySelector('#travel').src=`native-trial${trial}-${gear}-review.png.apng`;document.querySelector('#walk').src=`${gear}-cycle-study.png`;document.querySelector('#master').src=`../../veld-east-held-original-master-v1/frames/${gear}/000.png`;for(const id of ['bare','helmet'])document.getElementById(id).setAttribute('aria-pressed',String(id===gear));['short','middle','long'].forEach((id,i)=>document.getElementById(id).setAttribute('aria-pressed',String(i===trial)));}for(const id of ['bare','helmet'])document.getElementById(id).onclick=()=>{gear=id;update()};['short','middle','long'].forEach((id,i)=>document.getElementById(id).onclick=()=>{trial=i;update()});</script></html>
