<!doctype html><meta charset="utf-8"><title>Bill paired east swim master pass</title><style>body{background:#152027;color:#e6eff1;font:16px system-ui;margin:20px}p{max-width:80ch;color:#bdd0d2}.grid{display:flex;gap:12px;flex-wrap:wrap}.card{background:#22343e;padding:12px}canvas{display:block}button,select{font:inherit;background:#29404a;color:white;padding:6px}</style><h1>Bill — bare and shared-helmet swimming</h1><p>Six authored swimming poses with the exact selected helmet/face component and preserved moving body. Shared 960ms clock and water anchor. Candidates staged; tread/start/stop joins and native selection remain.</p><button id="play">Pause</button> <button id="step">Next pose</button> Height <select id="size"><option selected>148</option><option>82</option><option>54</option></select> Speed <select id="speed"><option value="1">1×</option><option value=".5">0.5×</option></select><span id="status"> Loading…</span><div class="grid" id="grid"></div><script>
const tracks=[{"label": "Canonical shared helmet \u00b7 east stroke", "files": ["frames/swim-east/000.png", "frames/swim-east/001.png", "frames/swim-east/002.png", "frames/swim-east/003.png", "frames/swim-east/004.png", "frames/swim-east/005.png"]}, {"label": "Master-relative bare \u00b7 east stroke", "files": ["../bill-swim-east-coherent-v1/frames/swim-east/000.png", "../bill-swim-east-coherent-v1/frames/swim-east/001.png", "../bill-swim-east-coherent-v1/frames/swim-east/002.png", "../bill-swim-east-coherent-v1/frames/swim-east/003.png", "../bill-swim-east-coherent-v1/frames/swim-east/004.png", "../bill-swim-east-coherent-v1/frames/swim-east/005.png"]}];let time=0,last=performance.now(),playing=true,manual=0;for(const t of tracks){const el=document.createElement('div');el.className='card';el.innerHTML='<strong>'+t.label+'</strong><canvas width="460" height="270"></canvas>';grid.append(el);t.canvas=el.querySelector('canvas')};play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play'};step.onclick=()=>{playing=false;manual=(manual+1)%6;play.textContent='Play'};
Promise.all(tracks.map(async t=>t.images=await Promise.all(t.files.map(f=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src=f+'?v=swim-v1'}))))).then(()=>{function draw(now){if(playing)time+=(now-last)*Number(speed.value);last=now;const i=playing?Math.floor(time/160)%6:manual,s=Number(size.value)/148;for(const t of tracks){const c=t.canvas.getContext('2d');c.fillStyle='#22343e';c.fillRect(0,0,460,135);c.fillStyle='#dae1e0';c.fillRect(0,135,460,135);for(const y of [70,205])c.drawImage(t.images[i],230-122*s,y-88*s,208*s,184*s)}document.querySelector('#status').textContent=' Both loops loaded · pose '+(i+1)+'/6';requestAnimationFrame(draw)}requestAnimationFrame(draw)}).catch(e=>document.querySelector('#status').textContent='Load failed '+e);</script>
