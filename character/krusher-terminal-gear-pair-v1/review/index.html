<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krusher terminal native gear pair</title>
<style>body{background:#272b2e;color:#e5ebee;font:18px system-ui;margin:20px}img{max-width:100%}button,select{font:inherit;padding:6px;margin:4px}p{max-width:900px}</style>
<h1>Krusher Dom / terminal gear pair</h1><p>Playback reconstructed from 19 paired Godot art captures with their observed pose holds. Original helmet and exact shared action body. Standalone art evidence; station review remains.</p>
<button id="play">Pause</button><button id="step">Next pose</button><label>Pose <select id="pose"></select></label><span id="status">Loading</span><br><img id="view" alt="Native bare and helmeted Krusher action comparison">
<script>
let samples=[],index=0,elapsed=0,last=0,playing=true,cycles=0;const view=document.querySelector('#view');
function draw(){view.src='native/'+samples[index].capture;document.querySelector('#pose').value=String(index);document.querySelector('#status').textContent=`${index+1}/${samples.length} / cycles ${cycles}`;}
function tick(now){const delta=last?now-last:0;last=now;if(samples.length&&playing){elapsed+=Math.min(delta,100);while(elapsed>=samples[index].observedHoldMs){elapsed-=samples[index].observedHoldMs;index=(index+1)%samples.length;if(index===0)cycles++;}draw();}requestAnimationFrame(tick);}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';};document.querySelector('#step').onclick=()=>{playing=false;document.querySelector('#play').textContent='Play';index=(index+1)%samples.length;elapsed=0;draw();};document.querySelector('#pose').onchange=e=>{playing=false;document.querySelector('#play').textContent='Play';index=Number(e.target.value);elapsed=0;draw();};
fetch('native/report.json').then(r=>r.json()).then(async r=>{await Promise.all(r.samples.map(s=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src='native/'+s.capture;})));samples=r.samples;for(let i=0;i<samples.length;i++){const option=document.createElement('option');option.value=String(i);option.textContent=samples[i].state+' / '+(samples[i].index+1);document.querySelector('#pose').append(option);}draw();requestAnimationFrame(tick);}).catch(()=>document.querySelector('#status').textContent='Native capture load failed');
</script>
