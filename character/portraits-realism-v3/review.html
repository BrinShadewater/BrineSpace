<!doctype html><html lang="en"><meta charset="utf-8"><title>Character portrait comparison</title><style>body{background:#101e27;color:#e3eaf0;font:16px system-ui;margin:28px}h1{font-size:24px}button{padding:10px 18px;margin:0 8px 18px 0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}figure{margin:0}img{width:100%;display:block}figcaption{padding:10px 0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style><h1>Character portrait comparison</h1><p id="version">New individual realism pass — V3</p><button onclick="show(3)">New portraits</button><button onclick="show(1)">Earlier smooth portraits</button><button onclick="show(2)">Earlier pixel pass</button><div class="grid"><figure><img src="../brine-comms-v14/portrait.png" alt="BRINE"><figcaption>BRINE — new V14</figcaption></figure><figure><img src="bill.png" alt="Major Bill" data-id="bill"><figcaption>Major Bill</figcaption></figure><figure><img src="veld.png" alt="Dr. Veld" data-id="veld"><figcaption>Dr. Veld</figcaption></figure><figure><img src="branforth.png" alt="Chief Engineer Branforth" data-id="branforth"><figcaption>Chief Engineer Branforth</figcaption></figure><figure><img src="marsh.png" alt="Marsh" data-id="marsh"><figcaption>Marsh</figcaption></figure><figure><img src="river.png" alt="River" data-id="river"><figcaption>River</figcaption></figure><figure><img src="josh.png" alt="Josh" data-id="josh"><figcaption>Josh</figcaption></figure><figure><img src="margot.png" alt="Margot" data-id="margot"><figcaption>Margot</figcaption></figure></div><script>function show(v){document.querySelectorAll('img[data-id]').forEach(i=>i.src=(v===3?'':'../portraits-realism-v'+v+'/')+i.dataset.id+'.png');document.getElementById('version').textContent={1:'Earlier smooth portraits — V1',2:'Earlier pixel pass — V2',3:'New individual realism pass — V3'}[v]}</script></html>
