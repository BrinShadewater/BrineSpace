<!doctype html><meta charset="utf-8"><title>Bill West low-elbow exit study</title><style>body{background:#182932;color:#eee;font:18px sans-serif;margin:24px}section{display:flex;gap:20px}canvas{background:#14242e;max-width:45vw}img{width:100%;max-width:1600px;display:block;margin:20px 0}button{font:inherit;margin:12px 6px}</style><h1>Bill west - first exit pose</h1><p>Two-pose study: the revised swimmer and an independently authored low-elbow support pose. Remaining exit poses, floor contact and full motion still need review.</p><section><div>Bare<br><canvas id="bare" width="352" height="320"></canvas></div><div>Helmet<br><canvas id="helmet" width="352" height="320"></canvas></div></section><button id="prev">Swimming</button><button id="next">Low elbow</button><span id="status"></span><h2>Master-scale exit comparison</h2><img src="master-exit-review.png"><h2>Head and collar</h2><img src="neck-review.png"><script>const names=['Swimming context','Low elbow'],banks={},ctx={};let phase=0;function draw(){for(const g of ['bare','helmet']){ctx[g].clearRect(0,0,352,320);ctx[g].drawImage(banks[g][phase],0,0)}document.querySelector('#status').textContent=names[phase]+' /pose '+(phase+1)+' of 2'}Promise.all(['bare','helmet'].map(async g=>{ctx[g]=document.querySelector('#'+g).getContext('2d');banks[g]=await Promise.all(names.map((_,i)=>new Promise(resolve=>{const im=new Image;im.onload=()=>resolve(im);im.src=g+'/frames/swim-land-west/'+String(i).padStart(3,'0')+'.png'})))})).then(draw);document.querySelector('#prev').onclick=()=>{phase=0;draw()};document.querySelector('#next').onclick=()=>{phase=1;draw()};</script>
