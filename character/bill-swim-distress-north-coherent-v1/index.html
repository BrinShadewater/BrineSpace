<!doctype html><meta charset="utf-8"><title>Bill north distress stroke candidates</title>
<style>body{font:16px system-ui;background:#152027;color:#e6eff1;margin:20px}p{max-width:80ch;color:#bdd0d2}button,select{font:inherit;padding:6px}canvas{display:block;margin-top:15px}</style>
<h1>Bill — north distress stroke</h1><p>Bare and helmet fatigue stroke. Exact selected swimming pose at the loop join; fixed anatomy scale and canonical helmet pixels. 960ms loop. Candidate preview; runtime selection awaits the directional family.</p>
<label>Gear <select id="gear"><option value="bare">Bare</option><option value="helmet">Helmet</option></select></label>
<label>Route <select id="route"></select></label>
<label>Height <select id="size"><option>148</option><option selected>82</option><option>54</option></select></label>
<button id="play">Pause</button><button id="step">Next pose</button> <span id="status"></span><canvas id="view" width="460" height="430"></canvas>
<script>const packs={"bare": [{"id": "swim-distress-north", "frameFiles": ["frames/swim-distress-north/000.png", "frames/swim-distress-north/001.png", "frames/swim-distress-north/002.png", "frames/swim-distress-north/003.png", "frames/swim-distress-north/004.png", "frames/swim-distress-north/005.png"], "frameDurationsMs": [160, 160, 160, 160, 160, 160], "loop": true, "facings": ["north", "north", "north", "north", "north", "north"], "waterKinds": ["swim", "swim", "swim", "swim", "swim", "swim"], "waterPoses": [true, true, true, true, true, true], "depthOffsets": [0, 0, 0, 0, 0, 0], "provenance": "four authored fatigue-stroke interiors;exact selected basic swimming join at both ends"}], "helmet": [{"id": "swim-distress-north", "frameFiles": ["../bill-swim-distress-helmet-north-coherent-v1/frames/swim-distress-north/000.png", "../bill-swim-distress-helmet-north-coherent-v1/frames/swim-distress-north/001.png", "../bill-swim-distress-helmet-north-coherent-v1/frames/swim-distress-north/002.png", "../bill-swim-distress-helmet-north-coherent-v1/frames/swim-distress-north/003.png", "../bill-swim-distress-helmet-north-coherent-v1/frames/swim-distress-north/004.png", "../bill-swim-distress-helmet-north-coherent-v1/frames/swim-distress-north/005.png"], "frameDurationsMs": [160, 160, 160, 160, 160, 160], "loop": true, "facings": ["north", "north", "north", "north", "north", "north"], "waterKinds": ["swim", "swim", "swim", "swim", "swim", "swim"], "waterPoses": [true, true, true, true, true, true], "depthOffsets": [0, 0, 0, 0, 0, 0], "provenance": "exact selected swimming helmet at native pixel scale over independently authored distress body; exact equipped loop join"}]};let playing=true,last=performance.now(),elapsed=0,manual=0;
for(const s of packs.bare){const o=document.createElement('option');o.value=s.id;o.textContent=s.id;route.append(o)}route.value='swim-distress-north';
gear.onchange=route.onchange=()=>{elapsed=0;manual=0};play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play'};step.onclick=()=>{playing=false;manual=(manual+1)%selected().frameFiles.length;play.textContent='Play'};
function selected(){return packs[gear.value].find(s=>s.id===route.value)}
Promise.all(Object.values(packs).flat().map(async s=>{s.images=await Promise.all(s.frameFiles.map(f=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src=f}))) })).then(()=>{function draw(now){if(playing)elapsed+=(now-last);last=now;const s=selected();let index=manual;if(playing){let cursor=elapsed%(s.frameDurationsMs.reduce((a,b)=>a+b,0));index=s.images.length-1;for(let i=0;i<s.images.length;i++){if(cursor<s.frameDurationsMs[i]){index=i;break}cursor-=s.frameDurationsMs[i]}}const c=view.getContext('2d');c.fillStyle='#22343e';c.fillRect(0,0,460,215);c.fillStyle='#dae1e0';c.fillRect(0,215,460,215);const factor=Number(size.value)/148;for(const y of [110,325])c.drawImage(s.images[index],230-128*factor,y-128*factor,256*factor,256*factor);document.querySelector('#status').textContent=' pose '+(index+1)+'/'+s.images.length;requestAnimationFrame(draw)}requestAnimationFrame(draw)});</script>
