ast=performance.now();const ctx=document.querySelector('canvas').getContext('2d');document.querySelector('#pause').onclick=()=>paused=!paused;Promise.all(tracks.map(async t=>{t.images=await Promise.all(t.files.map(f=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=f})));t.total=t.durations.reduce((a,b)=>a+b,0)})).then(()=>{document.querySelector('#status').textContent='Loaded both before/after pairs';function draw(now){if(!paused)time+=now-last;last=now;ctx.clearRect(0,0,1000,650);tracks.forEach((t,n)=>{let elapsed=time%t.total,i=0;while(elapsed>=t.durations[i]&&i<t.images.length-1){elapsed-=t.durations[i++]}const x=n%4*250,y=Math.floor(n/4)*215;ctx.fillStyle='#eee';ctx.fillText(t.name,x+25,y+22);const size=184*Number(document.querySelector('#size').value)/148;ctx.drawImage(t.images[i],x+125-size/2,y+205-size,size,size)});requestAnimationFrame(draw)}requestAnimationFrame(draw)}).catch(()=>document.querySelector('#status').textContent='Asset load failed');</script>
