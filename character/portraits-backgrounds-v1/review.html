<!doctype html><html lang="en"><meta charset="utf-8"><title>BrineSpace portrait backgrounds</title><style>body{background:#101e27;color:#e3eaf0;font:16px system-ui;margin:28px}h1{font-size:24px}button{padding:10px 18px;margin:0 8px 18px 0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}figure{margin:0}img{width:100%;display:block}figcaption{padding:10px 0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style><h1>Portrait backgrounds</h1><p>New station settings. BRINE and Margot retain their existing backgrounds.</p><button onclick="show(true)">New backgrounds</button><button onclick="show(false)">Previous backgrounds</button><div class="grid"><figure><img src="../brine-comms-v14/portrait.png" alt="BRINE"><figcaption>BRINE</figcaption></figure><figure><img src="bill.png" alt="Major Bill" data-id="bill"><figcaption>Major Bill</figcaption></figure><figure><img src="veld.png" alt="Dr. Veld" data-id="veld"><figcaption>Dr. Veld</figcaption></figure><figure><img src="branforth.png" alt="Chief Engineer Branforth" data-id="branforth"><figcaption>Chief Engineer Branforth</figcaption></figure><figure><img src="marsh.png" alt="Marsh" data-id="marsh"><figcaption>Marsh</figcaption></figure><figure><img src="river.png" alt="River" data-id="river"><figcaption>River</figcaption></figure><figure><img src="josh.png" alt="Josh" data-id="josh"><figcaption>Josh</figcaption></figure><figure><img src="../portraits-realism-v3/margot.png" alt="Margot"><figcaption>Margot</figcaption></figure></div><script>function show(n){document.querySelectorAll('img[data-id]').forEach(i=>i.src=(n?'':'../portraits-realism-v3/')+i.dataset.id+'.png')}</script></html>
