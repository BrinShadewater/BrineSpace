<!doctype html><meta charset="utf-8"><title>Crew swimming stroke review</title>
<style>body{background:#111b22;color:#dce7e9;font:16px system-ui;margin:24px}button,input{font:inherit}main{display:grid;grid-template-columns:repeat(2,minmax(300px,1fr));gap:12px}article{background:#1d252a;padding:12px}canvas{width:100%;max-width:520px;image-rendering:pixelated}h2{font-size:17px}#controls{position:sticky;top:0;background:#111b22;padding:12px 0}p{max-width:900px}output{margin-left:12px}</style>
<h1>Swimming: reach, pull, recover</h1><p>Directional stroke revisions for all three crew. Both columns share one clock and shoulder position. Wider revision canvases preserve reach without shrinking the body. East, west and south revisions are loaded provisionally in the runtime.</p>
<div id="controls"><button id="pause">Pause</button> <label>Phase <input id="phase" type="range" min="0" max="959" value="0"></label><output id="time"></output> <label><input id="helmet" type="checkbox"> Diving helmets</label></div>
<main id="rows"></main><p id="status">Loading frames…</p>
<script type="module">
const rows=document.querySelector('#rows'), packs=[];
const requestedDirection=new URLSearchParams(location.search).get('direction');
const direction=['east','west','south','north'].includes(requestedDirection)?requestedDirection:'east';
for(const [actor,name] of [['bill','Major Bill'],['veld','Dr. Veld'],['branforth','Chief Engineer Branforth']]){
 for(const version of ['current','revision']){
  const retained=direction==='north'&&actor==='veld';
  const prefix=version==='current'||retained?`../pilot/${actor}-swim-${direction}/`:`${actor}-swim-${direction}-v2/`;
  const manifest=await fetch(prefix+'manifest.json').then(r=>{if(!r.ok)throw Error(prefix);return r.json()});
  const article=document.createElement('article'), title=document.createElement('h2'),canvas=document.createElement('canvas');
  title.textContent=name+' — '+(version==='current'?'previous':(retained?'retained runtime cycle':'runtime revision'));canvas.width=416;canvas.height=276;article.append(title,canvas);rows.append(article);
  const frames=await Promise.all(manifest.states[0].frameFiles.map(file=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=prefix+file;})));
  const helmetPrefix=version==='current'||retained?`../equipment/fitting/${actor}-swim-${direction}/`:`${actor}-swim-${direction}-v2/helmet/`;
  const helmets=await Promise.all(manifest.states[0].frameFiles.map(file=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=helmetPrefix+file;})));
  packs.push({canvas,frames,helmets,manifest});
 }
}
const zoom=3, padding=16;
const anchorX=padding+Math.max(...packs.map(p=>p.manifest.pivot[0]))*zoom;
const anchorY=padding+Math.max(...packs.map(p=>p.manifest.pivot[1]))*zoom;
const reviewWidth=anchorX+padding+Math.max(...packs.map(p=>p.manifest.frameWidth-p.manifest.pivot[0]))*zoom;
const reviewHeight=anchorY+padding+Math.max(...packs.map(p=>p.manifest.frameHeight-p.manifest.pivot[1]))*zoom;
for(const p of packs){p.canvas.width=reviewWidth;p.canvas.height=reviewHeight;}
const cycleOf=manifest=>manifest.states[0].frameDurationsMs.reduce((sum,duration)=>sum+duration,0);
const comparisonCycle=Math.max(...packs.map(pack=>cycleOf(pack.manifest)));
function frameIndex(manifest,time){let cursor=((time%cycleOf(manifest))+cycleOf(manifest))%cycleOf(manifest);for(const [index,duration] of manifest.states[0].frameDurationsMs.entries()){if(cursor<duration)return index;cursor-=duration;}return manifest.states[0].frameFiles.length-1;}
let elapsed=0,previous=null,playing=true;
const phase=document.querySelector('#phase'),pause=document.querySelector('#pause');
phase.max=comparisonCycle-1;
pause.onclick=()=>{playing=!playing;pause.textContent=playing?'Pause':'Play'};
phase.oninput=()=>{playing=false;pause.textContent='Play';elapsed=Number(phase.value)};
document.querySelector('#status').textContent='Loaded 36 body frames and 36 helmet frames. Scrub across phase 6 → 1 to inspect the loop boundary.';
function render(now){const delta=previous===null?0:Math.max(0,Math.min(now-previous,100));if(playing)elapsed=(elapsed+delta)%comparisonCycle;previous=now;phase.value=elapsed;
document.querySelector('#time').textContent=`${Math.floor(elapsed)} ms · phase ${frameIndex(packs[1].manifest,elapsed)+1}`;
for(const {canvas,frames,helmets,manifest} of packs){const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,canvas.width,canvas.height);const image=(document.querySelector('#helmet').checked?helmets:frames)[frameIndex(manifest,elapsed)];ctx.drawImage(image,anchorX-manifest.pivot[0]*zoom,anchorY-manifest.pivot[1]*zoom,image.width*zoom,image.height*zoom);}
requestAnimationFrame(render)}requestAnimationFrame(render);
</script>
