<!doctype html><meta charset="utf-8"><title>Bill South water exit</title><style>body{background:#182932;color:#eee;font:17px sans-serif}canvas{height:min(600px,calc(100vh - 190px));width:auto;max-width:100%}img{max-width:100%}button,select{font:inherit;margin:6px;padding:6px}</style><h1>Bill South — independent water exit</h1><p>Six new complete exit poses. Source candidate: master, material, proportions, motion and physical contact remain under review.</p><button id="play">Play once</button><button id="next">Next pose</button><select id="speed"><option value="1">Normal</option><option value="4">Quarter</option></select><span id="pose"></span><br><canvas width="640" height="704"></canvas><br><img src="exit-contact.png"><script>const times=[40, 60, 65, 65, 65, 65, 65, 75];const images=times.map((_,i)=>{const im=new Image();im.src="bare/frames/swim-land-south/"+String(i).padStart(3,"0")+".png";return im}),ctx=document.querySelector("canvas").getContext("2d");let index=0,run=0;function draw(){ctx.clearRect(0,0,640,704);if(images[index].complete)ctx.drawImage(images[index],0,0,640,704);document.getElementById("pose").textContent="Pose "+index}images.forEach(im=>im.onload=draw);document.getElementById("next").onclick=()=>{run++;index=(index+1)%8;draw()};document.getElementById("play").onclick=async()=>{const token=++run;for(let i=0;i<8;i++){if(run!==token)return;index=i;draw();await new Promise(r=>setTimeout(r,times[i]*Number(document.getElementById("speed").value)))}};draw();</script>
