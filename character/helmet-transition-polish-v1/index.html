<!doctype html><meta charset="utf-8"><title>Helmet transition review</title><style>body{margin:16px auto;max-width:960px;background:#182126;color:#d4dfdf;font:16px system-ui}button{padding:10px;margin-right:20px}img{width:100%;image-rendering:pixelated}a{color:#9bccdc}</style><h1>Helmet transitions: before / after</h1><p>Each row shows fitting before and after, then removal before and after. The smaller figures show gameplay scale. Eight existing poses; original palettes and total action times preserved.</p><button id="pause">Pause</button><label>Time <input id="time" type="range" min="0" max="25" value="0"></label><span id="label"></span><img id="frame" src="native/phase-00.png" alt="Native helmet transition playback"><p><a href="README.md">Scope and checks</a></p><script type="module">const frames=await Promise.all(Array.from({length:26},(_,i)=>new Promise((ok,fail)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=fail;im.src=`native/phase-${String(i).padStart(2,'0')}.png`})));let playing=true,start=performance.now(),index=0;const slider=document.querySelector('#time'),button=document.querySelector('#pause');function show(i){index=i;document.querySelector('#frame').src=frames[i].src;slider.value=i;document.querySelector('#label').textContent=` ${(i/10).toFixed(1)} seconds`;}button.onclick=()=>{playing=!playing;button.textContent=playing?'Pause':'Play';start=performance.now()-index*100};slider.oninput=()=>{playing=false;button.textContent='Play';show(Number(slider.value))};function tick(t){if(playing)show(Math.floor(Math.max(0,t-start)/100)%26);requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
