<!doctype html><meta charset="utf-8"><title>Bill West standing-calibrated swimming</title><style>body{background:#182932;color:#eee;font:18px sans-serif;margin:24px}section{display:flex;gap:20px}canvas{background:#14242e;max-width:45vw}img{width:100%;max-width:1600px;display:block;margin:20px 0}button,select{font:inherit;margin:12px 6px}</style><h1>Bill West - calibrated swimming comparison</h1><p>All seven stroke poses now use shared standing calibration against the original master. Full stroke, body angle and in-game motion remain under review.</p><section><div>Bare<br><canvas id="bare" width="352" height="320"></canvas></div><div>Helmet<br><canvas id="helmet" width="352" height="320"></canvas></div></section><button id="play">Play</button><button id="prev">Previous pose</button><button id="next">Next pose</button><select id="speed"><option value="1">Normal speed</option><option value=".25">Quarter speed</option></select><span id="status"></span><h2>Paired seven-phase stroke</h2><img src="paired-stroke-review.png"><h2>Head and collar</h2><img src="neck-review.png"><h2>Source chronology</h2><img src="master-comparison.png"><script>const names=['Extend','Sweep','Pull','Gather','Recover','Reach','Glide'],banks={},ctx={};let phase=0,playing=false,last=0,time=0;function draw(){for(const g of ['bare','helmet']){ctx[g].clearRect(0,0,352,320);ctx[g].drawImage(banks[g][phase],0,0)}document.querySelector('#status').textContent=names[phase]+'  pose '+(phase+1)+' of 7'}Promise.all(['bare','helmet'].map(async g=>{ctx[g]=document.querySelector('#'+g).getContext('2d');banks[g]=await Promise.all(names.map((_,i)=>new Promise(resolve=>{const im=new Image;im.onload=()=>resolve(im);im.src=g+'/frames/swim-west/'+String(i).padStart(3,'0')+'.png'})))})).then(draw);document.querySelector('#play').onclick=()=>{playing=!playing;last=performance.now();document.querySelector('#play').textContent=playing?'Pause':'Play'};function step(delta){playing=false;document.querySelector('#play').textContent='Play';phase=(phase+delta+7)%7;time=[0,160,320,400,480,640,800][phase];draw()}document.querySelector('#next').onclick=()=>step(1);document.querySelector('#prev').onclick=()=>step(-1);function tick(now){if(playing){time=(time+(now-last)*Number(document.querySelector('#speed').value))%960;phase=[0,160,320,400,480,640,800].filter(t=>t<=time).length-1;draw()}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
