name: Source-only CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Reject media and binary files
        run: python3 tools/check_source_only.py
