name: CI

# A script-level gate for a Godot project. Two things it deliberately does NOT do:
#
#   - It does not pull raster art from Git LFS. Only preloaded audio is fetched;
#     Godot needs its imported resources to resolve script constants. Raster pointer
#     import errors are expected and do not establish runtime/art acceptance.
#   - It does not run the game. No exporter, no scene run, no headless boot yet.
#
# What it proves: every .gd file parses, and the project imports without a script
# error. --check-only exits non-zero on a parse error (verified by mutation on
# 2026-09-02); --import does not, so its log is grepped instead.

on:
  pull_request:
  push:
    branches: [main]

env:
  # The version the game is built and tested with (AGENTS.md). CI ran 4.6.1 until Sept 20.
  GODOT_VERSION: 4.7.2-stable

jobs:
  scripts:
    runs-on: ubuntu-latest
    # 15 was enough on Sept 12 (import 5 min, parse check 6). The art library added
    # thousands of files and the import alone now passes ten minutes.
    timeout-minutes: 40
    steps:
      - name: Checkout (no LFS smudge on purpose)
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Runtime image loading survives release exports
        run: |
          python3 tests/test_release_assert_safety.py
          python3 tests/test_release_manifest.py
      - name: Card bindings agree (art-free parity, needs no LFS)
        run: |
          python3 tests/test_card_binding_parity.py --self-test
          python3 tests/test_card_binding_parity.py
      - name: Authored layout keys resolve (art-free, needs no LFS)
        run: |
          python3 tests/test_layout_keys.py --self-test
          python3 tests/test_layout_keys.py
      - name: Fetch preloaded audio only
        # Every folder scripts/suno_audio_bank.gd preloads from. A preload of an unfetched LFS
        # pointer fails the whole script ("Could not resolve external class member CLIPS"):
        # tracks-v1 was added to the bank on Sept 18 and not here, and CI stayed red.
        run: git lfs pull --include="assets/audio/suno-v1/*.ogg,assets/audio/suno-polish-v1/*.wav,assets/audio/tracks-v1/*.ogg" --exclude=""
      - name: Fetch Godot ${{ env.GODOT_VERSION }} (headless-capable Linux build)
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot
          ./godot --version
      - name: Import resources before checking script preloads
        run: |
          ./godot --headless --path . --import > import.log 2>&1 || true
          if grep -q -E "SCRIPT ERROR|Parse Error" import.log; then
            echo "::error::import reported script errors"
            grep -E "SCRIPT ERROR|Parse Error" import.log | head -10
            exit 1
          fi
          echo "import has no script errors (raster LFS pointers intentionally unfetched)"
      - name: Every GDScript parses (one engine launch)
        run: |
          # One launch loads every tracked script. The old loop started Godot once per file:
          # six minutes for 400 scripts in September, and the repo now has twice that.
          git ls-files '*.gd' > gd-files.txt
          ./godot --headless --path . -s tests/ci_parse_all.gd -- "$PWD/gd-files.txt" > check.log 2>&1 || status=$?
          grep -E "PARSE FAIL|script\(s\) checked" check.log || true
          if [ "${status:-0}" -ne 0 ]; then
            echo "::error::one or more scripts failed to parse"
            grep -E "Parse Error|SCRIPT ERROR" check.log | head -20
            exit 1
          fi
